<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d1730"><title>Yen Atlas | 世界の通貨を日本円に</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#eef4ff;background:#0c1429}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 80% 0%,#223d73 0%,transparent 55%),#0c1429}main{max-width:760px;margin:auto;padding:36px 18px 70px}.eyebrow{color:#7cdbff;letter-spacing:.2em;font-size:12px;font-weight:700}h1{font-size:clamp(34px,7vw,60px);margin:10px 0 6px;letter-spacing:-.05em}p{color:#aebedb;line-height:1.7}.panel{background:#16233e;border:1px solid #334665;border-radius:24px;padding:24px;margin-top:28px;box-shadow:0 18px 50px #0003}label{display:block;color:#b8c8e5;font-size:13px;margin:18px 0 8px}input,select,button{font:inherit}input,select{width:100%;border:1px solid #435777;background:#0d1932;color:white;border-radius:14px;padding:15px;outline:none}input:focus,select:focus{border-color:#7cdbff}input[type=number]{font-size:26px;font-weight:700}button{cursor:pointer;border:0;border-radius:12px;padding:12px 16px;font-weight:700}.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.quick button{background:#26395b;color:#dce9ff}.quick button:hover{background:#38527b}.result{background:linear-gradient(135deg,#284c8b,#195d7c);border-radius:18px;padding:22px;margin-top:22px}.result small{color:#c7eaff}.result strong{display:block;font-size:clamp(30px,7vw,48px);margin:8px 0;overflow-wrap:anywhere}.actions{display:flex;gap:10px;margin-top:14px}.actions button{background:#7ce3ed;color:#06213b}.actions button.secondary{background:#334968;color:#fff}.note{font-size:12px;color:#9daecc}#status{min-height:24px}footer{margin-top:24px;color:#879cbd;font-size:12px}a{color:#90e6ff}@media(max-width:500px){.panel{padding:18px}.actions{flex-wrap:wrap}}
</style></head><body><main><div class="eyebrow">GLOBAL CURRENCY CONVERTER</div><h1>Yen Atlas<span style="color:#78e3ef">.</span></h1><p>世界の通貨を、わかりやすく日本円へ。逆換算にも対応。</p>
<section class="panel"><label for="amount">金額</label><input id="amount" type="number" value="50" min="0" step="any" inputmode="decimal"><label for="currency">通貨を選択・検索</label><input id="search" type="search" placeholder="国名・通貨名・USDなどで検索" aria-label="通貨検索"><select id="currency" aria-label="換算通貨"></select><div class="quick" id="quick"></div><div class="actions"><button class="secondary" id="reverse">⇄ 円から外貨へ切替</button><button class="secondary" id="refresh">↻ レート更新</button></div><div class="result"><small id="direction">日本円に換算</small><strong id="output">読み込み中…</strong><div id="rate"></div></div><div class="actions"><button id="copy">結果をコピー</button></div><p id="status" role="status"></p><p class="note">為替は参考値です。実際の両替・カード決済には手数料や独自レートが適用される場合があります。</p></section><footer>為替データ: <a href="https://frankfurter.dev/" target="_blank" rel="noopener">Frankfurter API</a> · 更新頻度は提供元に準拠 · APIキー不要</footer></main>
<script>
const $=id=>document.getElementById(id),api='https://api.frankfurter.dev/v2',fallback={USD:'米ドル',EUR:'ユーロ',GBP:'英ポンド',KRW:'韓国ウォン',CNY:'中国人民元',TWD:'台湾ドル',THB:'タイバーツ',AUD:'豪ドル',CAD:'カナダドル',CHF:'スイスフラン',SGD:'シンガポールドル',HKD:'香港ドル',INR:'インドルピー',JPY:'日本円'};
let names={...fallback},codes=[],reverse=false,rate=null,date='',lastOutput='';
const fmt=(n,code)=>new Intl.NumberFormat('ja-JP',{style:'currency',currency:code,maximumFractionDigits:code==='JPY'?2:4}).format(n);
async function loadCurrencies(){try{const r=await fetch(api+'/currencies');if(!r.ok)throw Error('通貨一覧取得失敗');const data=await r.json();if(Array.isArray(data)){names=Object.fromEntries(data.map(x=>[x.iso_code||x.code,x.name]).filter(x=>x[0]));}else names=data;codes=Object.keys(names).filter(x=>x!=='JPY').sort();}catch(e){codes=Object.keys(fallback).filter(x=>x!=='JPY').sort();$('status').textContent='通貨一覧を取得できなかったため、主要通貨を表示しています。';}renderOptions();await update();}
function renderOptions(){const prev=$('currency').value||'EUR',q=$('search').value.toLowerCase().trim();$('currency').replaceChildren();const filtered=codes.filter(c=>(c+' '+names[c]).toLowerCase().includes(q));for(const c of filtered){const o=document.createElement('option');o.value=c;o.textContent=c+' — '+names[c];$('currency').append(o)}if(filtered.includes(prev))$('currency').value=prev;else if(filtered.includes('EUR'))$('currency').value='EUR';renderQuick();}
function renderQuick(){const box=$('quick');box.replaceChildren();for(const c of ['USD','EUR','KRW','CNY','GBP','TWD']){if(!codes.includes(c))continue;const b=document.createElement('button');b.textContent=c;b.onclick=()=>{$('search').value='';renderOptions();$('currency').value=c;update()};box.append(b)}}
async function update(){const c=$('currency').value;if(!c){$('output').textContent='通貨を選んでね';return}const base=reverse?'JPY':c,quote=reverse?c:'JPY';$('direction').textContent=reverse?'日本円から '+c+' に換算':c+' から日本円に換算';$('output').textContent='計算中…';$('status').textContent='';try{const r=await fetch(api+'/rate/'+encodeURIComponent(base)+'/'+encodeURIComponent(quote));if(!r.ok)throw Error('レートを取得できませんでした');const d=await r.json();rate=Number(d.rate);date=d.date||'日付不明';if(!Number.isFinite(rate))throw Error('無効なレート');calculate();}catch(e){rate=null;$('output').textContent='取得できませんでした';$('rate').textContent='';$('status').textContent='通信状態を確認して、更新ボタンから再試行してね。';}}
function calculate(){if(rate===null)return;const n=Number($('amount').value),c=$('currency').value,from=reverse?'JPY':c,to=reverse?c:'JPY';if(!Number.isFinite(n)||n<0){$('output').textContent='0以上の金額を入力してね';return}lastOutput=fmt(n,from)+' = '+fmt(n*rate,to);$('output').textContent=fmt(n*rate,to);$('rate').textContent='1 '+from+' = '+Number(rate.toPrecision(9)).toLocaleString('ja-JP',{maximumFractionDigits:9})+' '+to+' · レート日付 '+date;}
$('currency').onchange=update;$('search').oninput=()=>{renderOptions();update()};$('amount').oninput=calculate;$('reverse').onclick=()=>{reverse=!reverse;$('reverse').textContent=reverse?'⇄ 外貨から円へ切替':'⇄ 円から外貨へ切替';update()};$('refresh').onclick=update;$('copy').onclick=async()=>{if(!lastOutput)return;try{await navigator.clipboard.writeText(lastOutput);$('status').textContent='換算結果をコピーしたよ！'}catch(e){$('status').textContent='コピーできませんでした'}};loadCurrencies();
</script></body></html>
